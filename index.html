<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183c35">
  <title>Cào tên ở quán trà</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <main class="layout">
    <header class="scene">
      <div class="scene-title">
        <p class="eyebrow">Trò chơi gọi tên</p>
        <h1>Cào tên<br>ở quán trà</h1>
      </div>
    </header>

    <section class="panel" aria-labelledby="panel-title">
      <h2 id="panel-title">Mời bạn một lượt</h2>
      <form id="setup">
        <label for="names">Danh sách người chơi</label>
        <p class="hint" id="names-hint">Nhập họ tên, mỗi người một dòng.</p>
        <textarea id="names" rows="5" placeholder="Nguyễn Minh Anh&#10;Trần Gia Huy&#10;Lê Bảo Ngọc" aria-describedby="names-hint" required></textarea>
        <label for="count">Số thẻ mỗi lượt</label>
        <select id="count">
          <option value="1">1 thẻ</option>
          <option value="2">2 thẻ</option>
          <option value="3">3 thẻ</option>
        </select>
        <button class="primary" type="submit">Bắt đầu</button>
      </form>

      <div id="play" hidden>
        <p class="hint" id="instructions">Rê chuột hoặc vuốt lên ô bạc để cào. Tên trùng với danh sách mới được gọi.</p>
        <div id="cards" aria-describedby="instructions"></div>
        <p id="status" role="status"></p>
        <div class="actions">
          <button class="primary" id="next" type="button" disabled>Lượt tiếp theo</button>
          <button id="edit" type="button">Sửa danh sách</button>
        </div>
        <h3>Đã được gọi</h3>
        <ol id="history"></ol>
      </div>
    </section>
  </main>
</body>
</html>
